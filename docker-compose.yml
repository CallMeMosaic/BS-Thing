version: '3.8'

services:
  rag-chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./data/chromadb:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag-network

  rag-llm:
    image: ollama/ollama:latest
    container_name: rag-llm
    ports:
      - "11434:11434"
    volumes:
      - ./data/rag-llm:/root/.ollama
    environment:
      - LLM_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag-network

  rag-server:
    build: ./rag-server
    container_name: rag-server
    ports:
      - "8080:8080"
    volumes:
      - .:/app  # Mountet das gesamte Projektverzeichnis nach /app
      - ./data/documents:/app/RAG-Server/documents  # Falls benötigt
    working_dir: /app  # Arbeitsverzeichnis im Container
    environment:
      - LLM_HOST=rag-llm
      - LLM_PORT=11434
    depends_on:
      rag-llm:
        condition: service_healthy
      rag-chromadb:
        condition: service_healthy
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge